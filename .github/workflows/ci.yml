name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "PORTING_STATUS.md"
      - "LICENSE"
      - "CODEOWNERS"
      - "clorch-logo*.png"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "PORTING_STATUS.md"
      - "LICENSE"
      - "CODEOWNERS"
      - "clorch-logo*.png"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Clojure tests (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        java: ["21", "22", "23", "24", "25"]

    env:
      CLORCH_FORCE_CPU: "1"
      JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Clojure CLI
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.5.1664

      - name: Cache Clojure dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-clojure-${{ hashFiles('deps.edn') }}
          restore-keys: |
            ${{ runner.os }}-clojure-

      - name: Resolve dependencies
        run: clojure -P -M:test

      - name: Run CPU test suite
        run: clojure -Sthreads 1 -M -m clorch.release-check --mode cpu
